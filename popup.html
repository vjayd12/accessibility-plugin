<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DWAO AI · v2</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:260px;background:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}
  .hdr{display:flex;align-items:center;gap:10px;padding:14px 14px 12px;border-bottom:1px solid #e2e8f0}
  .logo{width:36px;height:36px;border-radius:9px;overflow:hidden;background:#000;
    display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;color:#fff;flex-shrink:0}
  .logo img{width:100%;height:100%;object-fit:cover;display:block}
  .name{font-size:13px;font-weight:700;color:#1e293b;line-height:1.2}
  .sub{font-size:9px;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-top:1px}
  .ver{font-size:9px;color:#1a56db;background:#dbeafe;padding:1px 6px;border-radius:4px;margin-left:6px;font-weight:700}

  .audit{display:flex;align-items:center;justify-content:center;gap:8px;width:calc(100% - 28px);
    margin:12px 14px 6px;padding:11px;border-radius:8px;border:none;
    background:linear-gradient(135deg,#1a56db,#2563eb);color:#fff;
    font-size:12px;font-weight:700;cursor:pointer;letter-spacing:.3px;
    box-shadow:0 2px 8px rgba(26,86,219,.25)}
  .audit:hover{opacity:.92}

  .open{display:flex;align-items:center;justify-content:center;gap:8px;width:calc(100% - 28px);
    margin:6px 14px 6px;padding:9px;border-radius:8px;border:1px solid #e2e8f0;
    background:#fff;color:#1e293b;font-size:11px;font-weight:600;cursor:pointer}
  .open:hover{background:#f8fafc;border-color:#cbd5e1}

  .section{font-size:9px;font-weight:700;color:#94a3b8;text-transform:uppercase;
    letter-spacing:.8px;padding:10px 14px 4px}
  .btn{display:flex;align-items:center;gap:10px;width:100%;padding:7px 14px;
    background:none;border:none;cursor:pointer;text-align:left;color:#1e293b;transition:background .1s}
  .btn:hover{background:#f0f4ff}
  .btn-ico{width:28px;height:28px;border-radius:7px;background:#f1f5f9;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#1a56db}
  .btn-lbl{font-size:11px;font-weight:600}
  .btn-sub{font-size:9px;color:#94a3b8;margin-top:1px}
  .divider{height:1px;background:#f1f5f9;margin:4px 0}
  .status{font-size:10px;color:#94a3b8;padding:8px 14px 12px;text-align:center;min-height:14px}
</style>
</head>
<body>
<div class="hdr">
  <div class="logo"><img src="icons/icon128.png" alt="DWAO"></div>
  <div style="flex:1">
    <div class="name">DWAO AI <span class="ver">v2</span></div>
    <div class="sub">Accessibility Audit Suite</div>
  </div>
</div>

<button class="audit" id="auditBtn">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
  Run Full WCAG 2.2 Audit
</button>

<button class="open" id="openAll">
  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg>
  Open Manual Tools Panel
</button>
